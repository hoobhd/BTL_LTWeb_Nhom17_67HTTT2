<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máy tính cơ bản</title>
  <!-- Gắn file CSS (giao diện) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">

    <!-- Màn hình hiển thị -->
    <div class="screen">
      <div id="expression" class="expression"></div>
      <div id="display" class="display">0</div>
    </div>

    <!-- Các nút bấm. onclick gọi hàm tương ứng trong script.js -->
    <div class="buttons">
      <button class="gray" onclick="clearAll()">C</button>
      <button class="gray" onclick="backspace()">⌫</button>
      <button class="gray" onclick="percent()">%</button>
      <button class="orange" onclick="pressOperator('/')">÷</button>

      <button onclick="pressNumber('7')">7</button>
      <button onclick="pressNumber('8')">8</button>
      <button onclick="pressNumber('9')">9</button>
      <button class="orange" onclick="pressOperator('*')">×</button>

      <button onclick="pressNumber('4')">4</button>
      <button onclick="pressNumber('5')">5</button>
      <button onclick="pressNumber('6')">6</button>
      <button class="orange" onclick="pressOperator('-')">−</button>

      <button onclick="pressNumber('1')">1</button>
      <button onclick="pressNumber('2')">2</button>
      <button onclick="pressNumber('3')">3</button>
      <button class="orange" onclick="pressOperator('+')">+</button>

      <button class="gray" onclick="toggleSign()">±</button>
      <button onclick="pressNumber('0')">0</button>
      <button onclick="pressDot()">.</button>
      <button class="orange" onclick="equals()">=</button>
    </div>

  </div>

  <!-- Gắn file JavaScript (xử lý tính toán) -->
  <script src="script.js"></script>
</body>
</html>
